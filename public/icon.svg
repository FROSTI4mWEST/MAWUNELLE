<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ivoryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F5EFE8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B67F"/>
      <stop offset="50%" stop-color="#C5A46D"/>
      <stop offset="100%" stop-color="#A88349"/>
    </linearGradient>
  </defs>
  <!-- Background with slight padding -->
  <rect width="512" height="512" rx="128" fill="url(#ivoryBg)"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="204" fill="none" stroke="#D8C7B7" stroke-width="1.5" stroke-dasharray="4,6"/>
  
  <!-- Subtle botanical floral motif -->
  <g transform="translate(256, 120) scale(0.7)" fill="#D9B8B2" opacity="0.85">
    <path d="M0,-30 C15,-15 25,5 0,35 C-25,5 -15,-15 0,-30 Z"/>
    <path d="M-5,-10 C-30,-20 -35,5 -5,15 Z" opacity="0.7"/>
    <path d="M5,-10 C30,-20 35,5 5,15 Z" opacity="0.7"/>
  </g>

  <!-- Elegant Serif M -->
  <text x="256" y="325" font-family="'Playfair Display', 'Cormorant Garamond', serif" font-size="210" font-weight="500" fill="#3D302C" text-anchor="middle" letter-spacing="-4">M</text>
  
  <!-- Subtle Brand Name Underneath -->
  <text x="256" y="390" font-family="'Montserrat', 'Inter', sans-serif" font-size="26" font-weight="500" fill="#C5A46D" text-anchor="middle" letter-spacing="12">MAWUNELLE</text>
</svg>
